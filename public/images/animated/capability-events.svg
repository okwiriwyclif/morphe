    @keyframes flash { 50% { opacity: .2; } }
    @keyframes rise { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
