  </radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern></defs>
  <style>
    .fb { transform-box: fill-box; transform-origin: center; }
    .fl { transform-box: fill-box; transform-origin: left center; }
    .fbt { transform-box: fill-box; transform-origin: center bottom; }
    @keyframes b0 { 0%,0% { transform: scaleY(0); } 14%,86% { transform: scaleY(1); } 96%,100% { transform: scaleY(0); } }@keyframes b1 { 0%,4% { transform: scaleY(0); } 18%,86% { transform: scaleY(1); } 96%,100% { transform: scaleY(0); } }@keyframes b2 { 0%,8% { transform: scaleY(0); } 22%,86% { transform: scaleY(1); } 96%,100% { transform: scaleY(0); } }@keyframes b3 { 0%,12% { transform: scaleY(0); } 26%,86% { transform: scaleY(1); } 96%,100% { transform: scaleY(0); } }@keyframes b4 { 0%,16% { transform: scaleY(0); } 30%,86% { transform: scaleY(1); } 96%,100% { transform: scaleY(0); } }@keyframes b5 { 0%,20% { transform: scaleY(0); } 34%,86% { transform: scaleY(1); } 96%,100% { transform: scaleY(0); } }@keyframes b6 { 0%,24% { transform: scaleY(0); } 38%,86% { transform: scaleY(1); } 96%,100% { transform: scaleY(0); } }
    @keyframes draw { 0%,10% { stroke-dashoffset: 100; } 60%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } }
    @keyframes fade { 0%,30% { opacity: 0; } 60%,88% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes grow { from { transform: scaleX(.55); } to { transform: scaleX(1); } }
    @keyframes grow2 { 0% { transform: scaleX(0); } 70%,100% { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
