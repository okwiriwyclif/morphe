<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Live marketing analytics dashboard">
  <defs>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fed001"/>
    <stop offset=".3" stop-color="#fe9e15"/>
    <stop offset=".55" stop-color="#ee34a1"/>
    <stop offset=".8" stop-color="#a928c7"/>
    <stop offset="1" stop-color="#4e1594"/>
  </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fed001"/><stop offset="1" stop-color="#fb664c"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ee34a1" stop-opacity=".35"/><stop offset="1" stop-color="#ee34a1" stop-opacity="0"/></linearGradient>
    
  <radialGradient id="g1">
